name: canary

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llvm-nightly:
    name: tests against the LLVM nightly libclang
    runs-on: ubuntu-24.04
    # A nightly that moved under us is news, not a broken pull request: the
    # failure is recorded on the run and never blocks a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install the LLVM nightly libclang from apt.llvm.org
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/apt.llvm.org.gpg
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-snapshot main" |
            sudo tee /etc/apt/sources.list.d/llvm-snapshot.list
          sudo apt-get update
          package="$(apt-cache pkgnames libclang1- | sort -V | tail -n 1)"
          sudo apt-get install -y --no-install-recommends "$package"
          library="$(dpkg -L "$package" | grep -E '/libclang[^/]*\.so\.1$' | head -n 1)"
          echo "canary libclang: $library"
          echo "DEADWEIGHT_LIBCLANG=$library" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Test
        run: uv run --no-sync pytest -q
