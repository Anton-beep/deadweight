name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (libclang ${{ matrix.libclang }})
    # jammy, not noble: apt.llvm.org publishes no llvm-toolchain-noble-16, and the
    # matrix exists to prove the tool against four real libclang releases. The
    # distribution is not the subject; the library version is.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        libclang: ["16", "18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang ${{ matrix.libclang }} from apt.llvm.org
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "${{ matrix.libclang }}"
          # llvm.sh does not pull the libclang runtime on every release, and Debian
          # installs it under a multiarch directory as often as under llvm-N/lib. Both
          # packages are asked for by name, then the soname is discovered rather than
          # guessed: it is libclang.so / libclang.so.1 / libclang-N.so.1 depending on
          # the release and the packager.
          sudo apt-get install -y "libclang1-${{ matrix.libclang }}" "libclang-${{ matrix.libclang }}-dev"
          lib=$(ls /usr/lib/llvm-${{ matrix.libclang }}/lib/libclang.so* \
                   /usr/lib/*/libclang*${{ matrix.libclang }}.so* 2>/dev/null | head -n 1)
          test -n "$lib"
          echo "DEADWEIGHT_LIBCLANG=$lib" >> "$GITHUB_ENV"
          "$lib" --version 2>/dev/null || true

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Type check
        run: uv run --no-sync mypy src

      - name: Test
        # The packaging tests build the wheel, and the `packaging` job below is the
        # only place that happens: without the marker filter this matrix would build
        # it once per libclang.
        run: uv run --no-sync pytest -q -m 'not slow'

  packaging:
    name: packaging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Build and inspect the wheel
        run: uv run --no-sync pytest -q -m slow tests/packaging
