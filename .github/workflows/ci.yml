name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (libclang ${{ matrix.libclang }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        libclang: ["16", "18", "20", "22"]
    env:
      # Every future front-end test reads the library from here rather than
      # guessing what the distro installed.
      DEADWEIGHT_LIBCLANG: /usr/lib/llvm-${{ matrix.libclang }}/lib/libclang.so.1
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang ${{ matrix.libclang }} from apt.llvm.org
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "${{ matrix.libclang }}"
          test -e "$DEADWEIGHT_LIBCLANG"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Type check
        run: uv run --no-sync mypy src

      - name: Test
        # The packaging tests build the wheel, and the `packaging` job below is the
        # only place that happens: without the marker filter this matrix would build
        # it once per libclang.
        run: uv run --no-sync pytest -q -m 'not slow'

  packaging:
    name: packaging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Build and inspect the wheel
        run: uv run --no-sync pytest -q -m slow tests/packaging
