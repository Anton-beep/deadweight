[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deadweight"
version = "0.1.0"
description = "Find C and C++ functions that only your tests reach."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "the deadweight authors" }]
keywords = ["c", "cpp", "dead-code", "libclang", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: C",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
deadweight = "deadweight.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # The licence and the authorship record live in LICENSE and in git history;
  # a per-file copyright header would have to be maintained on every module.
  "CPY001",
]

[tool.ruff.lint.per-file-ignores]
# Test modules are not a package (no `__init__.py`), and `assert` is the
# assertion mechanism pytest rewrites. A test double has to accept the
# arguments of the seam it replaces without using them, which is what
# ARG005 flags in the `monkeypatch.setattr` lambdas.
"tests/**" = ["ARG005", "INP001", "S101"]
# The command line is the one module whose job is to write the report to
# stdout and the refusals to stderr.
"src/deadweight/cli.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
